# Checks every push and pull request: the site builds, no internal link is broken, and the built pages
# committed at the repository root match the sources. Publishing is done by GitHub Pages itself
# (Settings → Pages → Deploy from a branch → main, / root), not by this workflow.
name: Check site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site
        run: python tools/build.py
      - name: Check internal links
        run: python scripts/check_links.py
      - name: Built pages are committed
        run: git diff --exit-code -- index.html en .nojekyll sitemap.xml
